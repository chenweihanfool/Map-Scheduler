name: Build and Release

# Push a version tag (e.g. `git tag v1.2.0 && git push origin v1.2.0`) to
# build the Windows executables and publish a GitHub Release. The launcher
# (MapScheduler.exe, already installed by users) polls this repo's Releases
# API on every launch and auto-installs MapSchedulerApp.zip when its
# tag_name is newer than the locally installed version -- see
# launcher/index.ts. MapScheduler.exe itself is also attached to the
# release for first-time installs, but the launcher does not currently
# auto-update itself (see README/使用說明書 for manual reinstall notes).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Build app (client + server bundle)
        run: npm run build

      - name: Bundle launcher
        run: npx esbuild launcher/index.ts --platform=node --bundle --format=cjs --outfile=dist/launcher.cjs --minify

      - name: Package app exe
        run: npx pkg -t node24-win-x64 -o release/app/MapSchedulerApp dist/index.cjs

      - name: Package launcher exe
        run: npx pkg -t node24-win-x64 -o release/MapScheduler dist/launcher.cjs

      - name: Copy static assets next to app exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/app/public | Out-Null
          Copy-Item -Path dist/public/* -Destination release/app/public -Recurse -Force

      - name: Zip the auto-updatable app payload
        shell: pwsh
        run: Compress-Archive -Path release/app/* -DestinationPath MapSchedulerApp.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MapSchedulerApp.zip
            release/MapScheduler.exe
          generate_release_notes: true
